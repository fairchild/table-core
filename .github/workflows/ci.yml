name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci                    # also builds dist (prepare)
      - run: npm run typecheck         # sources and tests, without the DOM library
      - run: npm test                  # node --test: store, consistency, selection, boundary, docs
      - run: npm run smoke             # install the packed tarball in an empty project, type-check and run it
